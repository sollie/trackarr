<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{.assetbase}}/static/img/favicon.png">
    <title>trackarr</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
    <script>
      /* runtime server variables */
      window.apikey = '{{ .apikey }}';
      window.baseurl = '{{ .baseurl }}';
      window.version = '{{ .version }}';
      /* resolves built chunk urls against the runtime base url */
      window.assetUrl = (file) => window.baseurl.replace(/\/$/, '') + '/' + file;
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but trackarr doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
